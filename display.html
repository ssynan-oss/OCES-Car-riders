<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OCES Car Rider Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --royal:#3347B4; --scarlet:#F12025; --silver:#B8BABA;
    --bg:#F5F3EE; --card:#FFFFFF; --ink:#14181F; --soft:#5C6472; --line:#DFE1E6;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}

  header{flex:0 0 auto;background:var(--royal);color:#fff;padding:10px 18px;
         display:flex;align-items:center;gap:16px}
  header h1{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;margin:0;letter-spacing:-.3px}
  .now{margin-left:auto;display:flex;align-items:center;gap:14px;font-weight:800;font-size:17px}
  .dot{width:11px;height:11px;border-radius:50%;background:#43D17A}
  .dot.stale{background:#FFC53D} .dot.down{background:var(--scarlet)}
  .clock{font-variant-numeric:tabular-nums}

  .bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 18px;
       background:#fff;border-bottom:2px solid var(--line)}
  .bar .lbl{font-size:14px;font-weight:800;color:var(--soft);letter-spacing:.4px;text-transform:uppercase}
  .btn{font-family:inherit;font-weight:800;font-size:15px;border:2px solid var(--line);background:#fff;
       color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
  .btn.pri{background:var(--royal);border-color:var(--royal);color:#fff}
  .bar .count{margin-left:auto;font-size:15px;font-weight:800;color:var(--soft)}

  #scroll{flex:1 1 auto;overflow-y:auto;padding:14px 18px 60px;scroll-behavior:smooth}
  #scroll::-webkit-scrollbar{width:16px}
  #scroll::-webkit-scrollbar-thumb{background:var(--silver);border-radius:8px}

  .wave{margin-bottom:18px;border-radius:14px;overflow:hidden;border:3px solid var(--wc);background:#fff}
  .wave > .whead{background:var(--wc);color:#fff;padding:8px 16px;display:flex;align-items:center;gap:14px}
  .whead .wnum{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;line-height:1}
  .whead .wsub{font-size:15px;font-weight:700;opacity:.92}
  .whead .wtag{margin-left:auto;font-size:14px;font-weight:800;background:rgba(255,255,255,.22);
               border-radius:999px;padding:5px 13px}

  .lanes{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .lane{padding:0 0 10px}
  .lane + .lane{border-left:3px dashed var(--line)}
  .lanehead{font-family:'Bricolage Grotesque',sans-serif;font-size:20px;color:var(--wc);
            padding:9px 14px 6px;display:flex;align-items:baseline;gap:10px}
  .lanehead .lct{font-family:Inter,sans-serif;font-size:13px;font-weight:800;color:var(--soft)}
  .car.vacant{background:#FAFAF8;border-style:dashed;opacity:.45}
  .car.vacant .conebadge{background:var(--silver)}
  .nms .n.vac{color:var(--silver);font-weight:800}
  .cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px;padding:0 12px}
  @media (max-width:1100px){ .lanes{grid-template-columns:1fr} .lane + .lane{border-left:none;border-top:3px dashed var(--line)} }
  .car{display:flex;align-items:flex-start;gap:11px;border:2px solid var(--line);border-radius:11px;
       padding:10px 12px;background:#fff}
  .car.waiting{opacity:.55;border-style:dashed}
  .conebadge{flex:0 0 auto;background:var(--wc);color:#fff;border-radius:9px;width:52px;
             padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;line-height:1}
  .conebadge .cn{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;margin:1px 0}
  .conebadge .cl{font-size:10px;font-weight:800;opacity:.8;letter-spacing:1px;text-transform:uppercase}
  .nms{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nms .n{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.3px;
          overflow-wrap:anywhere}
  .nms .n.small{font-size:21px}

  .empty{padding:60px 20px;text-align:center;color:var(--soft)}
  .empty h2{font-family:'Bricolage Grotesque',sans-serif;font-size:40px;color:var(--royal);margin:0 0 8px}
  .empty p{font-size:20px;margin:0}
  .jump{position:fixed;right:24px;bottom:22px;background:var(--scarlet);color:#fff;border:none;
        font-family:'Bricolage Grotesque',sans-serif;font-size:18px;border-radius:999px;
        padding:14px 22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
</style>
</head>
<body>

<header>
  <h1>Car Rider Dismissal</h1>
  <div class="now">
    <span class="dot" id="dot"></span><span id="statusText">connecting…</span>
    <span class="clock" id="clock"></span>
  </div>
</header>

<div class="bar">
  <span class="lbl">Now loading</span>
  <span class="btn pri" id="curWave">Wave 1</span>
  <button class="btn" onclick="jumpCurrent()">Jump to current wave</button>
  <button class="btn" onclick="toggleWaiting()" id="waitBtn">Hide not-yet-called</button>
  <button class="btn" onclick="resetBoard()">Clear board history</button>
  <span class="count" id="count"></span>
</div>

<div id="scroll">
  <div class="empty" id="empty">
    <h2 id="emptyTitle">Car Rider Board</h2>
    <p id="emptySub">Ready — waiting for the first car.</p>
  </div>
  <div id="waves"></div>
</div>
<button class="jump" id="jumpBtn" onclick="jumpCurrent()">↓ Current wave</button>

<script>
  // ============================================================
  const API = 'https://script.google.com/macros/s/AKfycbx4S-v420NLWK2-5EYQaxs9-zCzOJpCqA_j4mttcdzCLK7-ePCgUdml5zbLgBGb79XhWg/exec';
  const KEY = 'oces-2026-2027';
  const POLL_MS = 3000;
  const SIZE = 10;
  // ============================================================

  // Wave colours cycle through this palette.
  const PALETTE = ['#3347B4','#1F8A4C','#C2600A','#7B3FA0','#0E8E99','#F12025','#B03060','#3F5566'];
  const waveColor = w => PALETTE[(w-1) % PALETTE.length];

  const LSKEY = 'oces-board-ledger-v15';   // bumped: old saved boards are ignored
  const CLOSEFLAG = 'oces-board-closed-handled';
  let ledger = {};        // id -> {names,row,wave,state}
  let curWave = 1, dayClosed = false;
  let lastOk = 0, showWaiting = true;

  // ---------- persistence so a refresh doesn't wipe the board ----------
  function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
  function saveLedger(){
    try{ localStorage.setItem(LSKEY, JSON.stringify({day:todayKey(),curWave,ledger})); }catch(e){}
  }
  function loadLedger(){
    try{
      const raw=localStorage.getItem(LSKEY); if(!raw) return;
      const o=JSON.parse(raw);
      if(o && o.day===todayKey()){ ledger=o.ledger||{}; curWave=o.curWave||1; }
    }catch(e){}
  }
  loadLedger();

  function tick(){
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    const age = Date.now() - lastOk;
    const dot=document.getElementById('dot'), st=document.getElementById('statusText');
    if(lastOk===0){ dot.className='dot down'; st.textContent='connecting…'; }
    else if(age < POLL_MS*2.5){ dot.className='dot'; st.textContent='live'; }
    else if(age < 20000){ dot.className='dot stale'; st.textContent='reconnecting…'; }
    else { dot.className='dot down'; st.textContent='connection lost'; }
  }
  setInterval(tick,1000); tick();

  async function poll(){
    try{
      const u=new URL(API);
      u.searchParams.set('key',KEY); u.searchParams.set('action','board'); u.searchParams.set('t',Date.now());
      const r=await fetch(u.toString()); const data=await r.json();
      if(data && data.A && data.B){ lastOk=Date.now(); absorb(data); render(); }
    }catch(e){}
  }
  setInterval(poll, POLL_MS); poll();

  // ---------- fold the live queue into the running ledger ----------
  function absorb(data){
    // ---- REMOTE WIPE ----------------------------------------------------
    // When the day is closed from the scanner, EVERY board that sees it wipes
    // its own history and reloads a fresh copy of this page. That reaches
    // phones and screens nobody remembers opening. One reload per close.
    if(data.closed){
      let already=false;
      try{ already = localStorage.getItem(CLOSEFLAG)==='1'; }catch(e){}
      ledger={}; curWave=1;
      try{ localStorage.removeItem(LSKEY); }catch(e){}
      if(!already){
        try{ localStorage.setItem(CLOSEFLAG,'1'); }catch(e){}
        const u=new URL(location.href);
        u.searchParams.set('r', Date.now());     // busts any cached copy
        location.replace(u.toString());
        return;
      }
      render(); return;
    }
    try{ localStorage.removeItem(CLOSEFLAG); }catch(e){}   // day is open again

    dayClosed=false;
    curWave = Math.max(data.A.wave||1, data.B.wave||1);
    const live = {};
    ['A','B'].forEach(rw=>{
      const q = data[rw].queue||[], base = data[rw].wave||1;
      q.forEach((car,idx)=>{
        const w = base + Math.floor(idx/SIZE);
        live[car.id]=true;
        const prev = ledger[car.id];
        const frozen = prev && prev.state==='done';
        ledger[car.id] = {
          names: car.names||[],
          row: rw,
          wave: frozen ? prev.wave : w,
          cone: frozen ? prev.cone : (idx % SIZE) + 1,
          state: idx < SIZE ? 'up' : 'waiting',
          seq: prev ? prev.seq : Date.now()+idx/1000
        };
      });
    });
    // anything that vanished: if it was already called up, it left with its wave.
    // if it was still waiting, a person removed it — drop it.
    Object.keys(ledger).forEach(id=>{
      if(live[id]) return;
      if(ledger[id].state==='waiting') delete ledger[id];
      else ledger[id].state='done';
    });
    saveLedger();
  }

  function resetBoard(){
    if(!confirm('Clear the names showing on this board?\n\nThis only clears THIS screen\u2019s history \u2014 it does not change the queue or the Sheet. The board will refill from what is still in line.')) return;
    ledger={}; try{ localStorage.removeItem(LSKEY); }catch(e){}
    render(); poll();
  }
  function jumpCurrent(){
    const el=document.getElementById('wave-'+curWave);
    if(el) el.scrollIntoView({block:'start'});
  }
  function toggleWaiting(){
    showWaiting=!showWaiting;
    document.getElementById('waitBtn').textContent = showWaiting ? 'Hide not-yet-called' : 'Show not-yet-called';
    render();
  }

  function render(){
    const entries=Object.keys(ledger).map(id=>Object.assign({id},ledger[id]));
    const shown = entries.filter(e=> showWaiting || e.state!=='waiting');
    document.getElementById('curWave').textContent='Wave '+curWave;

    if(!shown.length){
      document.getElementById('empty').style.display='block';
      document.getElementById('emptyTitle').textContent = dayClosed ? 'Dismissal Complete' : 'Car Rider Board';
      document.getElementById('emptySub').textContent = dayClosed
        ? 'Board cleared \u2014 see you tomorrow.' : 'Ready \u2014 waiting for the first car.';
      document.getElementById('waves').innerHTML='';
      document.getElementById('count').textContent='';
      document.getElementById('jumpBtn').style.display='none';
      return;
    }
    document.getElementById('empty').style.display='none';
    document.getElementById('jumpBtn').style.display='block';

    const byWave={};
    shown.forEach(e=>{ (byWave[e.wave]=byWave[e.wave]||[]).push(e); });
    const waves=Object.keys(byWave).map(Number).sort((a,b)=>a-b);

    const host=document.getElementById('waves'); host.innerHTML='';
    waves.forEach(w=>{
      const sec=document.createElement('section');
      sec.className='wave'; sec.id='wave-'+w;
      sec.style.setProperty('--wc', waveColor(w));
      const cars=byWave[w];
      const tag = w===curWave ? 'LOADING NOW' : (cars.every(c=>c.state==='waiting') ? 'staged' : 'loaded');
      sec.innerHTML =
        '<div class="whead"><span class="wnum">Wave '+w+'</span>'+
        '<span class="wsub">'+cars.length+' car'+(cars.length===1?'':'s')+'</span>'+
        '<span class="wtag">'+tag+'</span></div>';

      const lanes=document.createElement('div'); lanes.className='lanes';
      ['A','B'].forEach(rw=>{
        const mine=cars.filter(c=>c.row===rw).sort((a,b)=>(a.seq||0)-(b.seq||0));
        const slots=new Array(SIZE).fill(null);
        const orphans=[];
        mine.forEach(c=>{
          const k=(c.cone|0)-1;
          if(k>=0 && k<SIZE && !slots[k]) slots[k]=c; else orphans.push(c);
        });
        orphans.forEach(c=>{ const k=slots.indexOf(null); if(k!==-1) slots[k]=c; });
        const lane=document.createElement('div'); lane.className='lane';
        lane.innerHTML='<div class="lanehead">Row '+rw+'<span class="lct">'+
                       mine.length+' of '+SIZE+' cones</span></div>';
        const grid=document.createElement('div'); grid.className='cars';
        for(let k=0;k<SIZE;k++){
          const c=slots[k];
          const d=document.createElement('div');
          d.className='car'+(c?(c.state==='waiting'?' waiting':''):' vacant');
          const small = c && c.names.length>2 ? ' small' : '';
          d.innerHTML='<div class="conebadge"><span class="cn">'+(k+1)+'</span>'+
            '<span class="cl">cone</span></div><div class="nms">'+
            (c ? c.names.map(n=>'<div class="n'+small+'">'+esc(n)+'</div>').join('')
               : '<div class="n vac">\u2014</div>')+'</div>';
          grid.appendChild(d);
        }
        lane.appendChild(grid); lanes.appendChild(lane);
      });
      sec.appendChild(lanes);
      host.appendChild(sec);
    });

    const up=entries.filter(e=>e.state!=='waiting').length;
    const wait=entries.length-up;
    document.getElementById('count').textContent = up+' called · '+wait+' still staged';
  }

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  render();
</script>
</body>
</html>
