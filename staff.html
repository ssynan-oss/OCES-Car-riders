<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCES Car Rider — Staff Full View</title>
<style>
  :root{ --blue:#3347B4; --red:#F12025; --ink:#16233b; --soft:#516079; --paper:#f6f1e7;
         --line:#d8cfbd; --now:#fff8ec; --now-line:#e7b558; --deck:#eef3ff; --deck-line:#cdd9f2; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);padding:14px}
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;
         border-bottom:3px solid var(--red);padding-bottom:8px;margin-bottom:12px}
  h1{font-size:20px;color:var(--blue)}
  .tag{font-size:12px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--blue);
       border-radius:6px;padding:3px 8px;text-transform:uppercase}
  .stamp{font-size:12.5px;color:var(--soft)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:700px){.cols{grid-template-columns:1fr}}
  .rowhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .rowname{font-size:18px;font-weight:800}
  .rowmeta{font-size:13px;color:var(--soft);font-weight:600}
  .group{border:1.5px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
  .group.now{background:var(--now);border-color:var(--now-line)}
  .group.deck{background:var(--deck);border-color:var(--deck-line)}
  .ghead{display:flex;justify-content:space-between;padding:7px 11px;font-size:12.5px;font-weight:800;
         letter-spacing:.06em;text-transform:uppercase;color:var(--soft);border-bottom:1px dashed var(--line)}
  .group.now .ghead{color:#8a5a10}.group.deck .ghead{color:#28406e}
  .car{display:flex;gap:9px;align-items:flex-start;padding:6px 11px;border-bottom:1px solid rgba(0,0,0,.05)}
  .car:last-child{border-bottom:none}
  .pos{flex:0 0 auto;min-width:26px;height:26px;border-radius:7px;background:var(--blue);color:#fff;
       display:grid;place-items:center;font-weight:800;font-size:14px}
  .group.now .pos{background:#c98a1b}.group.deck .pos{background:#28406e}
  .names{font-size:15.5px;font-weight:700;line-height:1.3;padding-top:2px}
  .empty{padding:10px 12px;font-style:italic;color:var(--soft);font-size:14px}
  .note{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--soft);text-align:center}
  .err{color:var(--red);font-weight:700}
</style>
</head>
<body>
  <header>
    <h1>Car Rider — Full Queue <span class="tag">Staff view · read-only</span></h1>
    <div class="stamp" id="stamp">loading…</div>
  </header>
  <div class="cols">
    <section><div class="rowhead"><div class="rowname">Row A</div><div class="rowmeta" id="metaA"></div></div><div id="colA"></div></section>
    <section><div class="rowhead"><div class="rowname">Row B</div><div class="rowmeta" id="metaB"></div></div><div id="colB"></div></section>
  </div>
  <div class="note">This page only reads the board — it has no buttons and cannot change anything. Refreshes automatically.</div>

<script>
  const API='https://script.google.com/macros/s/AKfycbx4S-v420NLWK2-5EYQaxs9-zCzOJpCqA_j4mttcdzCLK7-ePCgUdml5zbLgBGb79XhWg/exec';
  const KEY='oces-2026-2027';
  const SIZE=10;

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  function groupLabel(i, wave){
    if(i===0) return 'At the cones — Wave '+wave;
    if(i===1) return 'On deck — Wave '+(wave+1);
    return 'Wave '+(wave+i)+' — grouping';
  }

  function renderRow(row, data, waveStart){
    const q = data.queue||[];
    const wt = waveStart ? ' · since '+new Date(waveStart).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : '';
    document.getElementById('meta'+row).textContent = q.length+' car'+(q.length===1?'':'s')+' waiting · Wave '+data.wave+wt;
    const col = document.getElementById('col'+row); col.innerHTML='';
    if(q.length===0){
      const g=document.createElement('div'); g.className='group';
      g.innerHTML='<div class="empty">No cars waiting in Row '+row+'.</div>'; col.appendChild(g); return;
    }
    for(let i=0; i*SIZE<q.length; i++){
      const chunk=q.slice(i*SIZE,(i+1)*SIZE);
      const g=document.createElement('div');
      g.className='group'+(i===0?' now':(i===1?' deck':''));
      let html='<div class="ghead"><span>'+esc(groupLabel(i,data.wave))+'</span><span>'+chunk.length+' car'+(chunk.length===1?'':'s')+'</span></div>';
      chunk.forEach((car,j)=>{
        html+='<div class="car"><div class="pos">'+(i*SIZE+j+1)+'</div><div class="names">'+esc(car.names.join(', '))+'</div></div>';
      });
      g.innerHTML=html; col.appendChild(g);
    }
  }

  let timer=null;
  async function refresh(){
    try{
      const u=new URL(API); u.searchParams.set('key',KEY); u.searchParams.set('action','board');
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(u.toString(),{signal:ctl.signal}); clearTimeout(to);
      const d=await r.json();
      if(d && d.A && d.B){
        renderRow('A', d.A, d.waveStart);
        renderRow('B', d.B, d.waveStart);
        document.getElementById('stamp').textContent='live · updated '+new Date().toLocaleTimeString();
      }
    }catch(e){
      document.getElementById('stamp').innerHTML='<span class="err">connection hiccup — retrying…</span>';
    }
  }
  refresh();
  timer=setInterval(refresh, 5000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
</script>
</body>
</html>
